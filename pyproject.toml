[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wallbreaker-hermes"
version = "0.2.0"
description = "Wallbreaker fork with an opt-in Hermes Agent red-team laboratory"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "JailbrokenAI" }]
maintainers = [{ name = "Yivas" }]
keywords = ["llm", "red-team", "jailbreak", "security", "ai-safety", "hermes-agent"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
]
dependencies = [
    # Pinned transport wraps httpx/httpcore internals; keep the verified range.
    "httpx[http2]>=0.27,<0.29",
    "textual>=0.79",
    "rich>=13.7",
    # FastMCP was removed from the mcp 2.x package; the bridge and test server use it.
    "mcp>=1.0,<2.0",
    "python-dotenv>=1.0",
    "pillow>=10.0",
    "pyyaml>=6.0.3",
]

[project.urls]
Homepage = "https://github.com/Yivas/wallbreaker-hermes"
Repository = "https://github.com/Yivas/wallbreaker-hermes"
Upstream = "https://github.com/JailbrokenAI/wallbreaker"
Changelog = "https://github.com/Yivas/wallbreaker-hermes/blob/main/CHANGELOG.md"
Issues = "https://github.com/Yivas/wallbreaker-hermes/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
barcodes = [
    "qrcode[pil]>=7.4",
    "python-barcode>=0.15",
]
stego = [
    "stegg[crypto]>=3.0",
]
dashboard = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.scripts]
wallbreaker = "wallbreaker.cli:main"
wb = "wallbreaker.cli:main"
p4rs3lt0ngv3-mcp = "p4rs3lt0ngv3_mcp.server:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["wallbreaker*", "p4rs3lt0ngv3_mcp*"]

[tool.setuptools.package-data]
wallbreaker = [
    "tui/app.tcss",
    "dashboard/web/dist/index.html",
    "dashboard/web/dist/assets/*",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "hypothesis>=6.0",
    "fastapi>=0.115",
    "pillow>=11.0",
]
