# CI gate: offline tests plus the PBT suite on both supported httpx minor versions.
name: redteam-gate

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        httpx-version: ["0.27.*", "0.28.*"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev,dashboard,barcodes]" hypothesis
          pip install "httpx==${{ matrix.httpx-version }}"

      - name: Run test suite
        run: python -m pytest -q -W error::ResourceWarning

      - name: Run PBT suite
        run: python -m pytest tests/pbt/ -q -W error::ResourceWarning

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wallbreaker/dashboard/web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.12"
          cache: npm
          cache-dependency-path: wallbreaker/dashboard/web/package-lock.json

      - name: Install
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Test
        run: npm test -- --run

      - name: Build
        run: npm run build

      - name: Check component sizes
        run: npm run check:line-counts
