name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Verify tag and project version
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          tag = os.environ["GITHUB_REF_NAME"]
          if tag != f"v{version}":
              raise SystemExit(f"tag {tag} does not match version {version}")
          PY

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.14"
          cache: npm
          cache-dependency-path: wallbreaker/dashboard/web/package-lock.json

      - name: Build dashboard
        working-directory: wallbreaker/dashboard/web
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test -- --run
          npm run build
          npm run check:line-counts

      - name: Test and build distributions
        run: |
          python -m pip install -U pip build twine
          python -m pip install -e ".[dev]"
          python -m pytest -q -W error::ResourceWarning
          python -m build
          python -m twine check dist/*
          python scripts/check_release_artifacts.py dist

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: distributions
          path: dist

      - name: Extract release notes
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          version = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          text = Path("CHANGELOG.md").read_text(encoding="utf-8")
          marker = f"## {version} - "
          start = text.find(marker)
          if start < 0:
              raise SystemExit(f"CHANGELOG has no {version} section")
          start = text.find("\n", start) + 1
          end = text.find("\n## ", start)
          notes = text[start:] if end < 0 else text[start:end]
          Path("release-notes.md").write_text(notes.strip() + "\n", encoding="utf-8")
          PY

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
            gh release edit "$GITHUB_REF_NAME" \
              --title "Wallbreaker Hermes $GITHUB_REF_NAME" \
              --notes-file release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --verify-tag \
              --title "Wallbreaker Hermes $GITHUB_REF_NAME" \
              --notes-file release-notes.md
          fi

  pypi:
    needs: github-release
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/wallbreaker-hermes/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: distributions
          path: dist

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/
          skip-existing: true
