name: Bug report
description: Report a reproducible defect in Wallbreaker Hermes.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Do not include credentials, private prompts, model responses, account or session IDs, private endpoints, configuration, run logs, or evidence sidecars. Report vulnerabilities through the repository Security tab.
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Run `wallbreaker --version` or provide the commit SHA.
      placeholder: wallbreaker-hermes 0.3.1
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, Python version, and installation method.
      placeholder: Windows 11, Python 3.13, PyPI wheel
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - CLI or TUI
        - Dashboard
        - Provider or target
        - Hermes laboratory
        - Campaign or review
        - MCP or Parseltongue
        - Packaging or documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal sanitized reproduction
      description: Provide exact commands and fictional inputs that reproduce the defect.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Add sanitized traces or screenshots only when they are needed.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched open and closed issues for this problem.
          required: true
        - label: I removed credentials, prompts, responses, identifiers, private endpoints, configuration, logs, and evidence.
          required: true
        - label: This is not an undisclosed security vulnerability.
          required: true
